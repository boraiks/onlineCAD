<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="onlineCAD System Architecture">
  <defs>
    <pattern id="bpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dd3fc" stroke-width="0.6" stroke-opacity="0.055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="419" rx="12" fill="#0c2340" stroke="#1e436e" stroke-width="1"/>
  <rect x="1" y="1" width="958" height="418" rx="12" fill="url(#bpGrid)"/>

  <!-- Header -->
  <text x="36" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.01em">System Architecture</text>
  <rect x="794" y="23" width="130" height="26" rx="13" fill="#102d52" stroke="#254d7a" stroke-width="1"/>
  <text x="859" y="40" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="11" font-weight="500">100% Client-Side</text>

  <!-- Layer 1: Workspace UI -->
  <rect x="36" y="68" width="888" height="58" rx="8" fill="#102d52" stroke="#254d7a" stroke-width="1"/>
  <rect x="46" y="79" width="3" height="36" rx="1.5" fill="#38bdf8"/>
  <text x="64" y="92" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">Workspace UI</text>
  <text x="64" y="113" fill="#94b8db" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5">Ribbon  ·  Draggable Dialogs  ·  ViewCube  ·  Tool Search</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="480" y1="126" x2="480" y2="148" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#arrow)"/>

  <!-- Layer 2: Document & History -->
  <rect x="36" y="152" width="888" height="58" rx="8" fill="#102d52" stroke="#254d7a" stroke-width="1"/>
  <rect x="46" y="163" width="3" height="36" rx="1.5" fill="#38bdf8"/>
  <text x="64" y="176" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">Document &amp; History</text>
  <text x="64" y="197" fill="#94b8db" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5">Feature Timeline  ·  IndexedDB Autosave  ·  .ocad / STL / 3MF / STEP / DXF</text>

  <!-- Split Connectors 2 -> 3A & 3B -->
  <path d="M 480 210 L 480 222 L 252 222 L 252 232" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#arrow)"/>
  <path d="M 480 222 L 708 222 L 708 232" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#arrow)"/>

  <!-- Layer 3A: 2D Sketch Engine -->
  <rect x="36" y="236" width="432" height="64" rx="8" fill="#102d52" stroke="#254d7a" stroke-width="1"/>
  <rect x="46" y="247" width="3" height="42" rx="1.5" fill="#38bdf8"/>
  <text x="64" y="263" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">2D Sketch Engine</text>
  <text x="64" y="285" fill="#94b8db" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5">Constraints  ·  Snapping  ·  Profiles</text>

  <!-- Layer 3B: Manifold WASM & Workers -->
  <rect x="492" y="236" width="432" height="64" rx="8" fill="#102d52" stroke="#254d7a" stroke-width="1"/>
  <rect x="502" y="247" width="3" height="42" rx="1.5" fill="#38bdf8"/>
  <text x="520" y="263" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">Manifold WASM &amp; Workers</text>
  <text x="520" y="285" fill="#94b8db" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5">CSG Booleans  ·  Repair  ·  Fill Hollow</text>

  <!-- Connectors 3 -> 4 -->
  <line x1="252" y1="300" x2="252" y2="324" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#arrow)"/>
  <line x1="708" y1="300" x2="708" y2="324" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#arrow)"/>

  <!-- Layer 4: WebGL2 Studio Renderer -->
  <rect x="36" y="328" width="888" height="58" rx="8" fill="#102d52" stroke="#254d7a" stroke-width="1"/>
  <rect x="46" y="339" width="3" height="36" rx="1.5" fill="#38bdf8"/>
  <text x="64" y="352" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">WebGL2 Studio Renderer</text>
  <text x="64" y="373" fill="#94b8db" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5">VBO Shading  ·  Crease Edges  ·  Zebra Curvature</text>
</svg>
